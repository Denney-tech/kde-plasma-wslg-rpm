---
name: Finish kwin submodule rebase

# Dependabot's gitsubmodule PRs only bump the packaging/kwin/dist-git pointer — they can't
# run our scripts. This finishes the job: regenerate wslg-kwin-rail.patch against the new
# tarball, confirm kwin.spec.patch still applies, and prove kwin builds, then push the
# result onto the PR branch so it's mergeable as-is.
#
# Needs pull_request_target, not pull_request: a Dependabot-authored PR triggering a plain
# `pull_request` workflow gets a read-only GITHUB_TOKEN and no repo secrets, by GitHub
# design (https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-on-actions)
# — there is no way to push a fix-up commit from that trigger. pull_request_target runs
# with the base repo's normal token/permissions instead; it does not check out the PR by
# default, so the checkout step below does that explicitly, and every subsequent step only
# runs known repo scripts against that checkout (no PR-supplied code is executed outside
# of the ordinary kwin build itself, which every PR already goes through in build.yml).
on:
  pull_request_target:
    paths:
      - packaging/kwin/dist-git

permissions:
  contents: write

concurrency:
  group: kwin-dependabot-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finish:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    name: Regenerate the C++ patch and prove kwin builds
    runs-on: ubuntu-latest
    container:
      image: quay.io/rockylinux/rockylinux:10
    steps:
      - name: Install git
        run: dnf -y install git-core

      - name: Check out the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Enable EPEL + CRB, install build tooling
        run: |
          dnf -y install epel-release
          dnf config-manager --set-enabled crb
          dnf -y install \
            rpm-build rpmdevtools 'dnf-command(builddep)' dnf-plugins-core \
            createrepo_c python3 diffutils patch curl tar xz file findutils

      - name: Regenerate wslg-kwin-rail.patch and verify the spec overlay
        id: rebase
        run: |
          if scripts/gen-patch.sh --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            scripts/gen-patch.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          scripts/check-specs.sh

      - name: Build kwin against the new dist-git ref
        run: scripts/build-rpms.sh kwin

      - name: Push the regenerated patch onto the PR branch
        if: steps.rebase.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/kwin/wslg-kwin-rail.patch
          git commit -m "fix: regenerate wslg-kwin-rail.patch for the new kwin tarball

          Auto-regenerated by kwin-dependabot-rebase.yml after Dependabot bumped
          packaging/kwin/dist-git.

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push origin "HEAD:$HEAD_REF"
